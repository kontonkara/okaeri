# okaeri's colors for kitty, written anew as they change. With this written to
# ~/.config/kitty/okaeri.conf, in kitty.conf:
#
#   include okaeri.conf
#
# kitty reads its config again on SIGUSR1, so `pkill -USR1 -x kitty` as the
# command for when the colors change has it take them at once. The palette has
# no greens or blues, so most of the sixteen terminal colors stay kitty's own:
# red is the palette's error, and bright black its dim.

foreground {{text}}
background {{background}}
selection_foreground {{background}}
selection_background {{accent}}
cursor {{accent}}
cursor_text_color {{background}}
url_color {{accent}}
active_border_color {{accent}}
inactive_border_color {{surface}}
bell_border_color {{error}}
active_tab_foreground {{background}}
active_tab_background {{accent}}
inactive_tab_foreground {{subtext}}
inactive_tab_background {{surface}}
tab_bar_background {{background}}
color1 {{error}}
color8 {{dim}}
color9 {{error}}
