# okaeri's colors for foot, written anew as they change. With this written to
# ~/.config/foot/okaeri.ini, at the top of foot.ini, in its main section:
#
#   include=~/.config/foot/okaeri.ini
#
# A foot takes them as it starts. They're the colors it starts with, foot 1.26's
# [colors-dark]: an older foot calls that [colors]. The palette has no greens or
# blues, so most of the sixteen terminal colors stay foot's own: red is the
# palette's error, and bright black its dim.

[colors-dark]
foreground={{text.strip}}
background={{background.strip}}
selection-foreground={{background.strip}}
selection-background={{accent.strip}}
cursor={{background.strip}} {{accent.strip}}
urls={{accent.strip}}
regular1={{error.strip}}
bright0={{dim.strip}}
bright1={{error.strip}}
