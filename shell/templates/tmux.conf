# okaeri's colors for tmux, written anew as they change. With this written to
# ~/.config/tmux/okaeri.conf, in tmux.conf:
#
#   source-file ~/.config/tmux/okaeri.conf
#
# `tmux source-file ~/.config/tmux/okaeri.conf` as the command for when the
# colors change has a tmux that runs take them at once.

set -g status-style "bg={{surface}},fg={{text}}"
set -g status-left-style "fg={{accent}}"
set -g status-right-style "fg={{subtext}}"
set -g window-status-style "fg={{subtext}}"
set -g window-status-current-style "fg={{accent}},bold"
set -g window-status-bell-style "fg={{error}},bold"
set -g pane-border-style "fg={{surface}}"
set -g pane-active-border-style "fg={{accent}}"
set -g message-style "bg={{surface}},fg={{text}}"
set -g message-command-style "bg={{surface}},fg={{accent}}"
set -g mode-style "bg={{accent}},fg={{background}}"
set -g display-panes-colour "{{dim}}"
set -g display-panes-active-colour "{{accent}}"
set -g clock-mode-colour "{{accent}}"
