# okaeri's colors for Qt apps, by qt6ct or qt5ct, written anew as they change.
# Written to ~/.config/qt6ct/colors/okaeri.conf, or qt5ct's, it's there to pick
# on its Appearance tab, under a custom color scheme, with the Fusion style;
# QT_QPA_PLATFORMTHEME=qt6ct (or qt5ct) has apps go by it. They take the colors
# as they start. Each line has twenty-one colors, in the order Qt has them:
# window text, button, light, midlight, dark, mid, text, bright text, button
# text, base, window, shadow, highlight, highlighted text, link, visited link,
# alternate base, none, tooltip base, tooltip text and placeholder text.

[ColorScheme]
active_colors={{text}}, {{surface}}, {{surface}}, {{surface}}, {{background}}, {{dim}}, {{text}}, {{text}}, {{text}}, {{background}}, {{background}}, #000000, {{accent}}, {{background}}, {{accent}}, {{accent}}, {{surface}}, {{background}}, {{surface}}, {{text}}, {{dim}}
inactive_colors={{text}}, {{surface}}, {{surface}}, {{surface}}, {{background}}, {{dim}}, {{text}}, {{text}}, {{text}}, {{background}}, {{background}}, #000000, {{accent}}, {{background}}, {{accent}}, {{accent}}, {{surface}}, {{background}}, {{surface}}, {{text}}, {{dim}}
disabled_colors={{dim}}, {{surface}}, {{surface}}, {{surface}}, {{background}}, {{dim}}, {{dim}}, {{dim}}, {{dim}}, {{background}}, {{background}}, #000000, {{surface}}, {{dim}}, {{dim}}, {{dim}}, {{surface}}, {{background}}, {{surface}}, {{dim}}, {{dim}}
