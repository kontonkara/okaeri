# okaeri's colors for fuzzel, written anew as they change. With this written to
# ~/.config/fuzzel/okaeri.ini, in fuzzel.ini's main section:
#
#   include=~/.config/fuzzel/okaeri.ini
#
# fuzzel takes them as it opens. Its colors have their opacity after them: ff
# is none of what's behind showing through.

[colors]
background={{background.strip}}ff
text={{text.strip}}ff
prompt={{subtext.strip}}ff
placeholder={{dim.strip}}ff
input={{text.strip}}ff
match={{accent.strip}}ff
selection={{surface.strip}}ff
selection-text={{text.strip}}ff
selection-match={{accent.strip}}ff
counter={{dim.strip}}ff
border={{surface.strip}}ff
